# Base paths for different environments
local:
  checkpoint: './checkpoint'
  tensorboard: './runs'
  cache: './cache'
  dataset_prefix: './dataset'

cluster:
  checkpoint: './checkpoint'
  tensorboard: './runs'
  cache: './cache'

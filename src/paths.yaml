    sentence_embedding: 'embeddings/sentence_384_embedding_params.pth'
    random_embedding: 'embeddings/random_384_embedding_params.pth'
    onehot_embedding: 'embeddings/onehot_embedding_params.pth' 
    bert_embedding: 'embeddings/bert_768_embedding_params.pth'